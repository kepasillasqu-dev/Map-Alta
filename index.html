<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Propiedades Tepic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-container{background:#ddd;outline-offset:1px}
.leaflet-bar{border-radius:4px}
.leaflet-bar a{display:block;text-align:center;text-decoration:none;width:30px;height:30px;line-height:30px;background:#fff;color:#000;border-bottom:1px solid #ccc}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px 'Lucida Console',Monaco,monospace;text-indent:1px}
.leaflet-control-attribution{margin:0}
.leaflet-control-attribution a{text-decoration:none}
.leaflet-tooltip{position:absolute;padding:6px;background:#fff;border:1px solid #fff;border-radius:3px;color:#222;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-tooltip.leaflet-interactive{cursor:pointer;pointer-events:auto}

/* Layout: mapa a pantalla completa; búsqueda y colonias flotan arriba; la ficha sube desde abajo en teléfono y se queda a la derecha en pantalla grande. */
:root {
  --bg: #eef2ef;
  --surface: #fbfcfb;
  --ink: #12292e;
  --muted: #587074;
  --line: #d3ddd9;
  --accent: #0e6a5a;
  --on-accent: #ffffff;
  --warm: #c4501b;
  --on-warm: #ffffff;
  --wa: #15803d;
  --on-wa: #ffffff;
  --toast-bg: rgba(14, 30, 34, 0.93);
  --map-bg: #e3eae6;
  --grid: rgba(18, 41, 46, 0.06);
  --photo-bg: #dbe8e3;
  --shadow: 0 6px 22px rgba(18, 41, 46, 0.18);
  --tile-filter: none;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1c1f; --surface: #172a2e; --ink: #e6efec; --muted: #93aaa6; --line: #2a4146;
    --accent: #46c9ad; --on-accent: #06231d; --warm: #f29a63; --on-warm: #2a1204; --wa: #3ccf7a; --on-wa: #052a15;
    --map-bg: #12262a; --grid: rgba(230, 239, 236, 0.06); --photo-bg: #1f3a3d;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.5); --tile-filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1c1f; --surface: #172a2e; --ink: #e6efec; --muted: #93aaa6; --line: #2a4146;
  --accent: #46c9ad; --on-accent: #06231d; --warm: #f29a63; --on-warm: #2a1204; --wa: #3ccf7a; --on-wa: #052a15;
  --map-bg: #12262a; --grid: rgba(230, 239, 236, 0.06); --photo-bg: #1f3a3d;
  --shadow: 0 6px 22px rgba(0, 0, 0, 0.5); --tile-filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; z-index: 0; background-color: var(--map-bg); }
.leaflet-container { background: var(--map-bg); font-family: var(--f-body); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.demo-grid .leaflet-container {
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* Barra superior */
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 500; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.search { position: relative; z-index: 3; margin-left: var(--gutter-l); margin-right: var(--gutter-r); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.sug { position: absolute; top: 54px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.sug button { display: flex; width: 100%; flex-direction: column; align-items: flex-start; gap: 1px; padding: 10px 14px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
.sug button:last-child { border-bottom: 0; }
.sug button:hover, .sug button:focus-visible { background: var(--bg); }
.sug .s-sub, .sug .s-none { color: var(--muted); font-size: 13px; }
.sug .s-none { padding: 12px 14px; }
.chips-wrap { position: relative; }
.chips { position: relative; display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; padding: 2px var(--gutter-r) 6px var(--gutter-l); scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 34px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 34px), transparent 100%); }
.chips.drag { user-select: none; }
.chips.drag .chip { pointer-events: none; }
@media (hover: hover) { .chips { cursor: grab; } .chips.drag { cursor: grabbing; } .chip { cursor: pointer; } }
.chips-nav { position: absolute; top: 0; z-index: 2; display: none; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px rgba(18, 41, 46, 0.2); }
.chips-nav svg { width: 16px; height: 16px; }
.chips-nav.prev { left: var(--gutter-l); }
.chips-nav.next { right: var(--gutter-r); }
@media (hover: hover) and (pointer: fine) { .chips-nav { display: grid; } }
.chips-nav[hidden] { display: none !important; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 2px 8px rgba(18, 41, 46, 0.12); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.chip b { font-weight: 600; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .85; }

.pill { position: absolute; left: var(--gutter-l); bottom: 14px; z-index: 450; max-width: calc(100% - 100px); padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12px; box-shadow: 0 2px 8px rgba(18, 41, 46, 0.12); }

/* Mapa: colonias, pines y puntos de interés */
.col-area { fill: var(--accent); fill-opacity: .07; stroke: var(--accent); stroke-opacity: .45; stroke-width: 1.5; stroke-dasharray: 5 6; }
.col-area.on { fill-opacity: .16; stroke-opacity: .9; stroke-dasharray: none; }
.col-label { background: none; border: 0; }
.col-btn { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); padding: 3px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--accent); font: 700 11.5px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 4px var(--surface), 0 0 4px var(--surface), 0 0 8px var(--surface); }
.pin-wrap { background: none; border: 0; }
.pin { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 7px)); padding: 4px 10px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 2px solid var(--accent); font: 700 12.5px/1.2 var(--f-body); font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 3px 10px rgba(18, 41, 46, 0.28); }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; transform: translateX(-50%); }
.pin.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); transform: translate(-50%, calc(-100% - 7px)) scale(1.1); }
.pin.sel::after { background: var(--accent); }
.pin.tramite { background: var(--warm); color: var(--on-warm); border-color: var(--warm); }
.pin.tramite::after { background: var(--warm); }
.pin.tramite.sel { background: var(--warm); color: var(--on-warm); border-color: var(--warm); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--warm); }
.poi-wrap { background: none; border: 0; }
.poi { position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4); }
.search-dot { background: none; border: 0; }
.search-dot span { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--warm); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .45); }
.radius-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 6; }
.leaflet-tooltip { background: var(--surface); color: var(--ink); border-color: var(--line); font-family: var(--f-body); font-size: 12.5px; box-shadow: var(--shadow); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar { border: 1px solid var(--line); box-shadow: var(--shadow); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--muted); font-size: 11px; padding: 1px 6px; }
.leaflet-control-attribution a { color: var(--accent); }
@media (max-width: 899px) { .leaflet-control-zoom { display: none; } }

/* Ficha de la propiedad */
.sheet { position: absolute; z-index: 600; left: 0; right: 0; bottom: 0; height: 66%; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(18, 41, 46, 0.25); visibility: hidden; transform: translateY(105%); transition: transform .28s ease, visibility 0s linear .28s; outline: none; }
.sheet.open { visibility: visible; transform: none; transition: transform .28s ease; }
.sheet .close { position: absolute; z-index: 2; top: 10px; right: var(--gutter-r); width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 2px 8px rgba(18, 41, 46, 0.18); }
.sheet .close svg { width: 16px; height: 16px; }
.sheet-body > * { flex: none; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px var(--gutter-r) 34px var(--gutter-l); display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) {
  .topbar { right: auto; width: min(860px, 100%); }
  .search { max-width: 560px; }
  .app.has-sheet .topbar { width: min(860px, calc(100% - 468px)); }
  .sheet { left: auto; top: 16px; right: 16px; bottom: 16px; width: 420px; height: auto; border-radius: 20px; transform: translateX(115%); transition: transform .28s ease, visibility 0s linear .28s; }
  .sheet.open { transform: none; }
  .sheet-body { padding-bottom: 28px; }
  .pill { bottom: 14px; }
}
.photo { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; background: var(--photo-bg); color: var(--accent); display: grid; place-items: center; margin-top: 36px; }
.photo svg { width: 40%; height: auto; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.photo-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
.interes { color: var(--accent); font-weight: 600; font-size: 14px; }
.interes:empty { display: none; }
.interes b { font-variant-numeric: tabular-nums; }
.photo-note { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.s-head { display: flex; flex-direction: column; gap: 4px; }
.s-head h2 { margin: 0; font: 700 21px/1.2 var(--f-display); text-wrap: balance; }
.price { font: 700 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.addr { color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0; }
.specs div { background: var(--surface); padding: 9px 12px; min-width: 0; }
.specs dt { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 0; font: 700 16px/1.3 var(--f-display); font-variant-numeric: tabular-nums; }
.sec h3 { margin: 0 0 8px; font: 700 15px/1.3 var(--f-display); letter-spacing: .01em; }
.sec p { margin: 0; max-width: 62ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.tags .tag { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: none; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
.tags .tag:hover { border-color: var(--accent); }
.tags .tag[aria-pressed="true"], .tags.value .tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.cat { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; }
.cat i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.poi-list li button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: inset 3px 0 0 var(--c); font-weight: 600; }
.poi-list li button { cursor: pointer; }
.poi { transition: transform .2s ease, opacity .2s ease; }
.poi-focus .poi:not(.on) { opacity: .4; }
.poi.on { transform: scale(1.6); z-index: 5; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent), 0 2px 8px rgba(0, 0, 0, 0.45); animation: poi-pulse 1.6s ease-out infinite; }
@keyframes poi-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent), 0 2px 8px rgba(0, 0, 0, 0.45); } 100% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--c) 0%, transparent), 0 2px 8px rgba(0, 0, 0, 0.45); } }
.leaflet-tooltip.poi-tip { font-weight: 700; border-color: var(--accent); }
.feat-bar { position: absolute; left: var(--gutter-l); top: 118px; z-index: 440; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 28px); padding: 5px 6px 5px 13px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 13px/1.2 var(--f-body); box-shadow: 0 3px 10px rgba(18, 41, 46, 0.28); }
.feat-bar[hidden] { display: none; }
.feat-bar button { flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.22); color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; }
.feat-bar button:hover { background: rgba(255, 255, 255, 0.34); }
.poi-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.poi-list li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.poi-list .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.poi-list .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.poi-list .ds { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.retry { margin-top: 6px; }

/* Me interesa / llamar / agendar */
.cta { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); }
.cta h3 { margin: 0; font: 700 17px/1.25 var(--f-display); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; text-decoration: none; text-align: center; }
.btn.alt { background: transparent; color: var(--accent); }
.btn-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.phone-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.phone-line span { font: 700 18px var(--f-display); font-variant-numeric: tabular-nums; user-select: all; }
.link-btn { border: 0; background: none; padding: 6px 2px; color: var(--accent); font-weight: 600; text-decoration: underline; }
.form { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; border-top: 1px solid var(--line); }
.form h4 { margin: 8px 0 0; font: 700 16px var(--f-display); }
.form label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.form input[type="text"], .form input[type="email"], .form input[type="tel"] { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; }
.form fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.form legend { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; padding: 0; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 40px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.opt:disabled { opacity: .45; text-decoration: line-through; cursor: not-allowed; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400 !important; font-size: 13.5px !important; }
.check input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }

/* ============ PUNTOS DE INTERÉS ============ */
function samplePois(p) {
  var SAMPLE = [['educacion', 'Escuela primaria'], ['educacion', 'Jardín de niños'], ['salud', 'Centro de salud'], ['salud', 'Farmacia'], ['compras', 'Supermercado'], ['compras', 'Tienda de conveniencia'], ['parques', 'Parque'], ['banco', 'Sucursal bancaria'], ['transporte', 'Parada de transporte']];

    out.push({ cat: s[0], name: s[1], lat: p.lat + d * Math.cos(ang) / 111320, lng: p.lng + d * Math.sin(ang) / (111320 * Math.cos(p.lat * Math.PI / 180)) });
  });

}
function catOf(t) {
  var a = t.amenity, s = t.shop, l = t.leisure;
  if (/^(school|kindergarten|college|university)$/.test(a)) return 'educacion';
  if (/^(hospital|clinic|doctors|pharmacy)$/.test(a)) return 'salud';
  if (a === 'bank') return 'banco';
  if (a === 'bus_station') return 'transporte';
  if (a === 'marketplace' || s) return 'compras';
  if (l) return 'parques';
  return null;
}
function serverPois(p) {
  if (!CFG.appsScriptUrl) return Promise.reject(new Error('sin servidor'));
  return fetch(CFG.appsScriptUrl + '?accion=cercanos&id=' + encodeURIComponent(p.id)).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !Array.isArray(j.cercanos)) throw new Error((j && j.error) || 'sin datos');
    return j.cercanos;
  });
}
var OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
function overpassPois(p) {
  var around = '(around:1000,' + p.lat + ',' + p.lng + ')';
  var q = '[out:json][timeout:15];(' +
    'nwr' + around + '["amenity"~"^(school|kindergarten|college|university|hospital|clinic|doctors|pharmacy|bank|marketplace|bus_station)$"];' +
    'nwr' + around + '["shop"~"^(supermarket|convenience|mall)$"];' +
    'nwr' + around + '["leisure"~"^(park|playground|sports_centre)$"];);out center 100;';

      .then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .catch(function (err) { clearTimeout(to); i++; if (i < OVERPASS.length) { return go(); } throw err; });
  }
  return go().then(function (j) {
    var out = [];
    j.elements.forEach(function (e) {
      var t = e.tags || {}, cat = catOf(t); if (!cat) return;
      var lat = e.lat != null ? e.lat : (e.center && e.center.lat), lng = e.lon != null ? e.lon : (e.center && e.center.lon);
      if (lat == null || !t.name && cat !== 'parques') return;

}

    el.innerHTML = '<h3>' + (tr ? 'Esta propiedad está en trámite' : '¿Te interesa esta propiedad?') + '</h3><p class="note" style="margin:0">' +
      (tr ? 'Pregunta si se libera o pide opciones parecidas.' : 'Pide más información por teléfono o agenda una visita para conocerla.') +
      '</p><button type="button" class="btn" data-action="interesa">Me interesa</button>' + share;
    return;
  }
  el.innerHTML = '<h3>Gracias por tu interés</h3>' +
    '<div class="btn-row"><a class="btn alt" href="tel:' + CFG.telefonoTel + '" data-action="llamar">Llamar</a><button type="button" class="btn" data-action="agendar">Agendar cita</button></div>' +
    '<div class="phone-line"><span id="tel-num">' + esc(CFG.telefono) + '</span><button type="button" class="link-btn" data-action="copiar">Copiar número</button></div>' +
    '<div id="cita-box"></div>' + share;
  if (state.form) { renderForm(); }
}
function openDays() {
  var out = [], d = new Date(); d.setHours(0, 0, 0, 0);
  while (out.length < 6) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0) out.push(new Date(d)); }
  return out;
}
function slotsFor(d) { return d.getDay() === 6 ? ['09:00', '10:00', '11:00', '12:00'] : ['09:00', '10:00', '11:00', '12:00', '13:00', '15:00', '16:00', '17:00']; }
var useServer = !DEMO && !!CFG.appsScriptUrl;
function fetchBusy(iso) {
  if (useServer) {
    return fetch(CFG.appsScriptUrl + '?fecha=' + encodeURIComponent(iso)).then(function (r) { return r.json(); }).then(function (j) { return j.ocupadas || []; });
  }
  var d = fromIso(iso), r = rng(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()), sl = slotsFor(d), busy = [];
  for (var i = 0; i < 2; i++) { busy.push(sl[Math.floor(r() * sl.length)]); }
  return Promise.resolve(busy);
}
function renderForm() {
  var p = state.sel, box = $('#cita-box'); if (!box || !p) return;
  var f = state.form, days = openDays();
  box.innerHTML = '<div class="form"><h4>Elige día y hora</h4><p class="note" style="margin:0">' + esc(p.titulo) + ' · ' + esc(p.calle) + '</p>' +
    '<fieldset><legend>Día</legend><div class="pick">' + days.map(function (d) {
      var iso = isoDate(d);
      return '<button type="button" class="opt" data-action="date" data-v="' + iso + '" aria-pressed="' + (f.fecha === iso) + '">' + esc(d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' })) + '</button>';
    }).join('') + '</div></fieldset>' +
    '<fieldset><legend>Hora</legend><div class="pick" id="f-horas">' + slotsHtml() + '</div></fieldset>' +
    '<p class="err" id="f-err" role="alert"></p>' +
    '<a class="btn wa" id="wa-send" href="#" target="_blank" rel="noopener" data-action="wa-send" aria-disabled="true">Confirmar cita por WhatsApp</a>' +
    '<p class="note" style="margin:0">Se abre WhatsApp con el mensaje ya escrito. Envíalo para que te confirmen la cita.</p></div>';
  updateWa();
}
function updateWa() {
  var f = state.form, p = state.sel, a = $('#wa-send'); if (!a || !p) return;
  var ok = !!(f && f.fecha && f.hora);
  a.setAttribute('aria-disabled', ok ? 'false' : 'true');
  a.href = ok ? waLink(citaText(p, f), CFG.whatsapp) : '#';
}
function slotsHtml() {
  var f = state.form;
  if (!f.fecha) return '<span class="note" style="margin:0">Elige primero un día.</span>';
  if (f.loading) return '<span class="note" style="margin:0">Revisando horarios libres…</span>';
  return slotsFor(fromIso(f.fecha)).map(function (s) {
    var busy = (f.busy || []).indexOf(s) > -1;
    return '<button type="button" class="opt" data-action="slot" data-v="' + s + '"' + (busy ? ' disabled' : '') + ' aria-pressed="' + (f.hora === s) + '">' + s + '</button>';
  }).join('');
}
function pickDate(iso) {
  var f = state.form; f.fecha = iso; f.hora = null; f.busy = []; f.loading = true; renderForm();
  fetchBusy(iso).then(function (b) { if (state.form !== f || f.fecha !== iso) return; f.busy = b; f.loading = false; renderForm(); })
    .catch(function () { if (state.form !== f) return; f.busy = []; f.loading = false; renderForm(); });
}

/* ============ EVENTOS DE LA FICHA ============ */
sheet.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]'); if (!t) return;
  var a = t.getAttribute('data-action'), p = state.sel;
  if (a === 'close') { closeSheet(); }
  else if (a === 'interesa') { state.interested[p.id] = true; renderCta(); var ag = $('[data-action="agendar"]'); if (ag) ag.focus({ preventScroll: true }); }
  else if (a === 'agendar') {
    if (!state.form) { state.form = {}; pickDate(isoDate(openDays()[0])); } else { renderForm(); }
    var bx = $('#cita-box'); if (bx) { bx.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  else if (a === 'copiar') { copyText(CFG.telefono, $('#tel-num')); t.textContent = 'Número copiado'; setTimeout(function () { t.textContent = 'Copiar número'; }, 2000); }
  else if (a === 'date') { pickDate(t.getAttribute('data-v')); }
  else if (a === 'slot') { state.form.hora = t.getAttribute('data-v'); $('#f-horas').innerHTML = slotsHtml(); updateWa(); }
  else if (a === 'wa-send') { if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); var er = $('#f-err'); if (er) { er.textContent = 'Elige un día y una hora.'; } } }
  else if (a === 'feat') { setFeat(t.getAttribute('data-v')); }
  else if (a === 'poi') { hlPoi(+t.getAttribute('data-i')); }
  else if (a === 'retry-poi') { loadPois(p); }
});

/* ============ AVISOS FLOTANTES (solo con datos reales de la hoja) ============ */
var toastItems = [], toastTimers = [], toastHide = null, toastCur = null;
function ago(iso) {
  var t = Date.parse(iso || ''); if (!t) return null;
  var m = Math.round((Date.now() - t) / 60000); if (m < 0) return null;
  if (m < 1) return 'unos segundos';
  if (m < 60) return m + ' min';
  var h = Math.round(m / 60); if (h < 24) return h + ' h';
  var d = Math.round(h / 24); return d + (d === 1 ? ' día' : ' días');
}
function alertText(p) {
  var a = p.alerta, tipo = norm(a.tipo || ''), t = ago(a.fecha);
  var lugar = '"' + p.titulo + ' - ' + p.colonia + '" (' + short(p.precio) + ')';
  var dias = a.fecha ? (Date.now() - Date.parse(a.fecha)) / 86400000 : null;
  if (/tramite|apart/.test(tipo)) { return '🔴 Actualización: ' + lugar + ' está EN TRÁMITE' + (t ? ' desde hace ' + t : '') + '.'; }
  if (/demanda/.test(tipo)) { return a.visitas > 0 ? '🔥 Alta demanda: ' + lugar + ' tiene ' + a.visitas + (a.visitas === 1 ? ' visita agendada' : ' visitas agendadas') + ' esta semana.' : null; }
  if (/cita|visita/.test(tipo)) { return (t && dias !== null && dias <= 14) ? '📡 Pulso del Radar: hace ' + t + ' se agendó visita para ' + lugar + '.' : null; }
  return null;
}
function buildToasts() {
  toastItems = PROPS.filter(function (p) { return p.alerta; }).map(function (p) { return { p: p, t: alertText(p), ts: Date.parse(p.alerta.fecha) || 0 }; })
    .filter(function (x) { return x.t; }).sort(function (a, b) { return b.ts - a.ts; });
}
function showToast(i) {
  var it = toastItems[i], el = $('#toast'); if (!it || !el || document.hidden) return;
  toastCur = it.p.id;
  $('#toast-txt').textContent = it.t;
  el.hidden = false;
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('in'); }); });
  armToast(6000);
}
function armToast(ms) { clearTimeout(toastHide); toastHide = setTimeout(hideToast, ms); }
function hideToast() {
  var el = $('#toast'); if (!el) return;
  clearTimeout(toastHide); el.classList.remove('in');
  setTimeout(function () { if (!el.classList.contains('in')) { el.hidden = true; } }, 350);
}
function startToasts() {
  toastTimers.forEach(clearTimeout); toastTimers = [];
  buildToasts();
  if (!toastItems.length) return;
  toastTimers.push(setTimeout(function () { showToast(0); }, 20000));
  if (toastItems.length > 1) { toastTimers.push(setTimeout(function () { showToast(1); }, 60000)); }
}
(function toastEvents() {
  var el = $('#toast');
  el.addEventListener('mouseenter', function () { clearTimeout(toastHide); });
  el.addEventListener('mouseleave', function () { if (el.classList.contains('in')) { armToast(3000); } });
  el.addEventListener('focusin', function () { clearTimeout(toastHide); });
  el.addEventListener('focusout', function () { if (el.classList.contains('in')) { armToast(3000); } });
  $('#toast-go').addEventListener('click', function () { var p = BYID[toastCur]; hideToast(); if (p) { ensureVisible(p); selectProp(p.id); } });
  $('.toast-x', el).addEventListener('click', hideToast);
}());

/* ============ INICIO ============ */
function setPill(t) { var el = $('#demo-pill'); el.textContent = t; el.hidden = !t; }
function openFromHash() {
  var h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (h && BYID[h]) { ensureVisible(BYID[h]); selectProp(h); }
}
function start(cols, props) {
  setData(cols, props.map(normProp)); computeRadar(); build(); renderChips(); applyFilter(false); openFromHash(); startToasts();
}
window.addEventListener('hashchange', openFromHash);
function loadData() {
  pillBase = ''; setPill('Cargando propiedades…');
  fetch(CFG.appsScriptUrl + '?accion=datos').then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.colonias || !j.propiedades) { throw new Error('formato'); }
    var cols = {}; j.colonias.forEach(function (c) { cols[c.nombre] = { c: [c.lat, c.lng], r: c.radio || 500 }; });
    start(cols, j.propiedades);
    if (j.avisos && j.avisos.length && window.console) { console.warn('Avisos de la hoja:', j.avisos); }
    setPill(PROPS.length ? '' : 'Todavía no hay propiedades en venta.');
  }).catch(function () { setPill('No se pudieron cargar las propiedades. Recarga la página.'); });
}
if (useServer) { loadData(); }
else {
  DEMO_PROPS.forEach(function (p) { if (p.alerta && p.alerta.min != null) { p.alerta.fecha = new Date(Date.now() - p.alerta.min * 60000).toISOString(); } });
  pillBase = DEMO ? 'Demostración: propiedades, precios y avisos de ejemplo' : 'Datos de ejemplo. Falta conectar la hoja de Google.';
  start(DEMO_COLONIAS, DEMO_PROPS);
  setPill(pillBase);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(function () { return {}; }); } catch (e) {} }
}());

</script>
